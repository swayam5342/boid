<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Boids Simulation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        h1 {
            color: #e0e0e0;
            font-size: 1.4rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .box {
            width: 1280px;
            height: 720px;
            max-width: 90vw;
            max-height: 80vh;
            border: 2px solid #444;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
            position: relative;
            background: #fff5e4;
        }

        .box canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #888;
            font-size: 1rem;
            letter-spacing: 0.1em;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Boids Simulation</h1>
        <div class="box" id="sim-box">
            <div class="loading" id="loading">Loading...</div>
        </div>
    </div>

    <script src="wasm_exec.js"></script>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(
            fetch("main.wasm"),
            go.importObject
        ).then((result) => {
            document.getElementById("loading").remove();
            go.run(result.instance);

            // Move canvas Ebiten creates into our box
            const canvas = document.querySelector("canvas");
            if (canvas) {
                document.getElementById("sim-box").appendChild(canvas);
            }
        });
    </script>
</body>

</html>
